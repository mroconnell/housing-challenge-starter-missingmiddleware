# Dependabot keeps dependencies patched and flags known vulnerabilities.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Versions of actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python pipeline dependencies (pyproject.toml, uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # The interactive tool's npm dependencies (ui/package.json, ui/package-lock.json).
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
