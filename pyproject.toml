[project]
name = "missing-middleware"
version = "0.1.0"
description = "Transparent Wisconsin housing-policy simulator: current-law baseline vs benchmark reforms, five-year permitted units"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "pyproj>=3.6",
]
ml = [
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["missing_middleware"]
