[project]
name = "missing-middleware"
version = "0.1.0"
description = "Transparent Wisconsin housing-policy simulator: current-law baseline vs benchmark reforms, five-year permitted units"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
]

[project.optional-dependencies]
geo = [
  # open-licence geometry (missing_middleware/geom.py): numpy (via pandas) and scipy, both BSD-3-Clause
  "scipy>=1.11",
]
ml = [
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["missing_middleware"]
